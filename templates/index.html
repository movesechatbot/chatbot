<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Web</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body class="dark-mode">
    <!-- Connection Status Bar -->
    <div id="connectionBar" class="connection-bar d-none">
        <span>Conectando...</span>
    </div>

    <div class="container-fluid p-0 h-100">
        <div class="row g-0 h-100">
            <!-- Left Sidebar - Conversation List -->
            <div class="col-12 col-md-4 col-lg-3 sidebar-column" id="sidebarColumn">
                <div class="sidebar d-flex flex-column h-100">
                    <!-- Sidebar Header -->
                    <div class="sidebar-header d-flex align-items-center justify-content-between p-3">
                        <div class="user-avatar">
                            <img src="../foto_perfil_movelina.jpg" alt="Usuário" class="avatar-img">
                        </div>
                        <div class="header-actions d-flex gap-3">
                            <button class="btn-icon" aria-label="Status">
                                <i class="bi bi-circle"></i>
                            </button>
                            <button class="btn-icon" aria-label="Nova conversa">
                                <i class="bi bi-chat"></i>
                            </button>
                            <button class="btn-icon" id="themeToggle" aria-label="Alternar tema">
                                <i class="bi bi-moon-fill"></i>
                            </button>
                            <button class="btn-icon" aria-label="Menu">
                                <i class="bi bi-three-dots-vertical"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Search Bar -->
                    <div class="search-container p-2">
                        <div class="search-input-wrapper">
                            <i class="bi bi-search"></i>
                            <input type="text" class="search-input" placeholder="Procurar ou começar nova conversa" aria-label="Buscar conversas">
                        </div>
                    </div>

                    <!-- Conversation List -->
                    <div class="conversation-list flex-grow-1 overflow-auto">
                        <!-- Conversations will be populated by JS -->
                    </div>

                    <!-- Floating New Chat Button -->
                    <button class="btn-floating" aria-label="Nova conversa">
                        <i class="bi bi-chat-fill"></i>
                    </button>
                </div>
            </div>

            <!-- Right Column - Chat Area -->
            <div class="col-12 col-md-8 col-lg-9 chat-column" id="chatColumn">
                <!-- Empty State -->
                <div class="empty-state d-flex flex-column align-items-center justify-content-center h-100" id="emptyState">
                    <div class="empty-icon mb-4">
                        <i class="bi bi-chat-dots"></i>
                    </div>
                    <h2 class="empty-title mb-2">Chat Web</h2>
                    <p class="empty-text text-center">Envie e receba mensagens sem manter seu telefone conectado.<br>Use o Chat Web em até 4 dispositivos vinculados e 1 telefone ao mesmo tempo.</p>
                </div>

                <!-- Active Chat -->
                <div class="chat-container d-none h-100 d-flex flex-column" id="chatContainer">
                    <!-- Chat Header -->
                    <div class="chat-header d-flex align-items-center justify-content-between p-3">
                        <div class="d-flex align-items-center gap-3 flex-grow-1">
                            <button class="btn-icon d-md-none" id="backToList" aria-label="Voltar">
                                <i class="bi bi-arrow-left"></i>
                            </button>
                            <div class="chat-avatar">
                                <img src="/placeholder.svg" alt="" class="avatar-img" id="chatAvatar">
                            </div>
                            <div class="chat-info">
                                <h3 class="chat-name mb-0" id="chatName">Nome do Contato</h3>
                                <p class="chat-status mb-0" id="chatStatus">online</p>
                            </div>
                        </div>
                        <div class="chat-actions d-flex gap-3">
                            <button class="btn-icon" aria-label="Pesquisar">
                                <i class="bi bi-search"></i>
                            </button>
                            <button class="btn-icon" aria-label="Anexar">
                                <i class="bi bi-paperclip"></i>
                            </button>
                            <button class="btn-icon" aria-label="Menu">
                                <i class="bi bi-three-dots-vertical"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Messages Area -->
                    <div class="messages-area flex-grow-1 overflow-auto" id="messagesArea">
                        <!-- Messages will be populated by JS -->
                    </div>

                    <!-- Scroll to Bottom Button -->
                    <button class="btn-scroll-bottom d-none" id="scrollBottomBtn" aria-label="Rolar para baixo">
                        <i class="bi bi-chevron-down"></i>
                    </button>

                    <!-- Message Composer -->
                    <div class="message-composer d-flex align-items-end gap-2 p-3">
                        <button class="btn-icon" aria-label="Emoji">
                            <i class="bi bi-emoji-smile"></i>
                        </button>
                        <button class="btn-icon" aria-label="Anexar">
                            <i class="bi bi-plus-lg"></i>
                        </button>
                        <div class="composer-input-wrapper flex-grow-1">
                            <textarea class="composer-input" placeholder="Digite uma mensagem" rows="1" id="messageInput" aria-label="Digite uma mensagem"></textarea>
                        </div>
                        <button class="btn-icon" id="sendBtn" aria-label="Enviar mensagem">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body p-0 text-center">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    <img src="/placeholder.svg" alt="Imagem ampliada" class="img-fluid rounded" id="modalImage">
                </div>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu d-none" id="contextMenu">
        <button class="context-menu-item">
            <i class="bi bi-reply"></i>
            <span>Responder</span>
        </button>
        <button class="context-menu-item">
            <i class="bi bi-clipboard"></i>
            <span>Copiar</span>
        </button>
        <button class="context-menu-item text-danger">
            <i class="bi bi-trash"></i>
            <span>Deletar</span>
        </button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='app.js') }}?v=3"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

</body>
</html>
